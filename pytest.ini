[pytest]
testpaths = tests

# Keep only the last run's temp tree. The suite builds real ffmpeg fixtures
# and a working folder per test, so the default retention of three runs grew
# /tmp/pytest-of-dave to 158MB — and it is visible in the app's own folder
# tree, which is how it got noticed.
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
